<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediMind AI - Complete Health Copilot</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d9488',
                        primaryHover: '#0f766e',
                        secondary: '#3b82f6',
                        background: '#f8fafc',
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signOut,
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            getFirestore, collection, onSnapshot, doc, setDoc, addDoc, deleteDoc, updateDoc, getDoc
        };
    </script>

    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            overscroll-behavior-y: none; 
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;

        const CUSTOM_FIREBASE_CONFIG = null; 

        const translations = {
            English: {
                dashboard: 'Dashboard', memory: 'Health Memory', analyzer: 'Lab Reports', prescription: 'Prescriptions', pillScan: 'Know Your Medicine', hospitals: 'Nearby Hospitals', chat: 'AI Buddy', meds: 'Medicines', prep: 'Doctor Prep', record: 'Visit Recording', appts: 'Appointments', family: 'Family Care', wellness: 'Wellness', settings: 'Settings',
                uploadAudio: 'Upload Audio/Video', startRecording: 'Tap to start recording', recording: 'Recording in progress...', analyzeSymptoms: 'Analyze Symptoms'
            }
        };

        const Icons = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        };

        const callGemini = async (prompt, systemInstruction = "You are a helpful medical assistant.") => {
            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, systemInstruction })
                });
                const data = await response.json();
                if (data.error) return `<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>API Error: ${data.error}</div>`;
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process that.";
            } catch (e) {
                return `<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>Network Error: ${e.message}</div>`;
            }
        };

        // Placeholder Screens to prevent undefined crashes
        const LoginScreen = ({ setUser }) => (
            <div className="flex flex-col items-center justify-center min-h-[100dvh] p-6 bg-slate-50">
                <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center space-y-4">
                    <h1 className="text-2xl font-bold text-teal-600">MediMind AI</h1>
                    <p className="text-sm text-slate-500">Welcome to your complete health copilot.</p>
                    <button 
                        onClick={() => setUser({ uid: 'demo-user', email: 'user@medimind.com' })}
                        className="w-full py-3 bg-teal-600 text-white rounded-xl font-semibold shadow-lg hover:bg-teal-700 transition"
                    >
                        Enter Demo Mode
                    </button>
                </div>
            </div>
        );

        const OnboardingScreen = ({ onComplete }) => (
            <div className="flex flex-col items-center justify-center min-h-[100dvh] p-6">
                <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full space-y-4">
                    <h2 className="text-xl font-bold">Quick Profile Setup</h2>
                    <button 
                        onClick={() => onComplete({ name: 'User', age: 25, gender: 'Other' })}
                        className="w-full py-2 bg-teal-600 text-white rounded-xl font-semibold"
                    >
                        Continue to Dashboard
                    </button>
                </div>
            </div>
        );

        const AdminApp = () => <div className="p-6">Admin Dashboard</div>;

        const App = () => {
            const [user, setUser] = useState({ uid: 'demo-user', email: 'user@medimind.com' });
            const [userProfile, setUserProfile] = useState({ name: 'User', age: 25, gender: 'Other' });
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [chatInput, setChatInput] = useState('');
            const [chatResponse, setChatResponse] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAskAI = async () => {
                if (!chatInput.trim()) return;
                setLoading(true);
                const res = await callGemini(chatInput);
                setChatResponse(res);
                setLoading(false);
            };

            return (
                <div className="flex h-[100dvh] overflow-hidden">
                    <div className="w-64 bg-white border-r border-slate-200 p-4 flex flex-col justify-between hidden md:flex">
                        <div>
                            <h1 className="text-xl font-bold text-teal-600 mb-6">MediMind AI</h1>
                            <button onClick={() => setCurrentTab('dashboard')} className="flex items-center gap-3 w-full p-3 rounded-xl bg-teal-50 text-teal-700 font-semibold">
                                <Icons.Home /> Dashboard
                            </button>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col overflow-y-auto p-6 space-y-6">
                        <h2 className="text-2xl font-bold">Health Copilot Dashboard</h2>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                            <h3 className="font-semibold text-lg">Test Gemini Proxy Integration</h3>
                            <div className="flex gap-2">
                                <input 
                                    type="text" 
                                    value={chatInput} 
                                    onChange={(e) => setChatInput(e.target.value)} 
                                    placeholder="Ask a health question..." 
                                    className="flex-1 border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:border-teal-600"
                                />
                                <button onClick={handleAskAI} disabled={loading} className="px-6 py-2 bg-teal-600 text-white rounded-xl font-semibold hover:bg-teal-700 transition">
                                    {loading ? 'Thinking...' : 'Ask AI'}
                                </button>
                            </div>
                            {chatResponse && (
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-slate-700" dangerouslySetInnerHTML={{ __html: chatResponse }}></div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
