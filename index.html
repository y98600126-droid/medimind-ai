    <script type="module">

        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signOut,
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            getFirestore, collection, onSnapshot, doc, setDoc, addDoc, deleteDoc, updateDoc, getDoc
        };
    </script>

    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            overscroll-behavior-y: none; 
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>

                uploadAudio: 'ஆடியோ/வீடியோ பதிவேற்றவும்', startRecording: 'பதிவைத் தொடங்க தட்டவும்', recording: 'பதிவு செய்யப்படுகிறது...', analyzeSymptoms: 'அறிகுறிகளை பகுப்பாய்வு செய்'

        const Icons = {

            Pill: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>,
            Clipboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>,
            Mic: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>,
            Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,

            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Upload: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Camera: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Hospital: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>,
            MapPin: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        };

        const buildProfileContext = (profile) => {
            if (!profile) return "";
            return `\n\nCRITICAL PATIENT CONTEXT: Name: ${profile.name}, Age: ${profile.age}, Gender: ${profile.gender}, Allergies: ${profile.allergies || 'None'}, Past Operations: ${profile.operations || 'None'}.`;
        };

        // 🚀 SECURE PROXY CALLS (Replaces direct client-side API key usage)
        const callGemini = async (prompt, systemInstruction = "You are a helpful medical assistant.") => {
            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, systemInstruction })
                });
                const data = await response.json();
                
                if (data.error) {
                    return `<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>API Error: ${data.error}</div>`;
                }
                
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process that.";
            } catch (e) {
                return `<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>Network Error: ${e.message}</div>`;
            }
        };

        const callGeminiImage = async (prompt, base64Image, mimeType, systemInstruction = "You are a helpful medical assistant.") => {
            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, base64Image, mimeType, systemInstruction })
                });
                const data = await response.json();
                
                if (data.error) {
                    return `<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>API Error: ${data.error}</div>`;
                }
                
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process the image.";
            } catch (e) {
                return `<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>Network Error: ${e.message}</div>`;
            }
        };

        const GlobalMedicineReminder = ({ db, user, appId }) => {
            const remindedMedsRef = useRef(new Set());
            const [meds, setMeds] = useState([]);

            useEffect(() => {
                if ('Notification' in window && Notification.permission === 'default') {
                    try { Notification.requestPermission(); } catch (e) { console.warn(e); }
                }

                if (!db || !user || !appId) return;
                try {
                    const { collection, onSnapshot } = window.firebaseModules;
                    const medsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'medicines');
                    const unsubscribe = onSnapshot(medsRef, (snapshot) => {
                        const loadedMeds = [];
                        snapshot.forEach(doc => loadedMeds.push({ id: doc.id, ...doc.data() }));
                        setMeds(loadedMeds);
                    }, err => console.warn("Background Snapshot warn:", err));
                    return () => unsubscribe();
                } catch (e) {
                    console.warn("Global Reminder Init fallback", e);
                }
            }, [db, user, appId]);

            useEffect(() => {
                if (meds.length === 0) return;
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                    
                    meds.forEach(med => {
                        if (med.time === timeStr && med.status === 'pending') {
                            const remindKey = med.id + '-' + timeStr + '-' + now.toDateString();
                            if (!remindedMedsRef.current.has(remindKey)) {
                                remindedMedsRef.current.add(remindKey);
                                
                                if ('Notification' in window && Notification.permission === 'granted') {
                                    try {
                                        new Notification("MediMind Alert", {
                                            body: `It is time to take your medicine: ${med.name}`,
                                            icon: "https://cdn-icons-png.flaticon.com/512/2966/2966327.png"
                                        });
                                    } catch (e) { console.error("Notification error:", e); }
                                }

                                if ('speechSynthesis' in window) {
                                    try {
                                        const msg = new SpeechSynthesisUtterance(`Reminder: It is time to take your medicine, ${med.name}.`);
                                        window.speechSynthesis.speak(msg);
                                    } catch (e) {
                                        console.warn("Speech Synthesis blocked.", e);
                                    }
                                }
                            }
                        }
                    });
                }, 10000); 
                return () => clearInterval(timer);
            }, [meds]);

            return null; 
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [authInstance, setAuthInstance] = useState(null);
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [familyMember, setFamilyMember] = useState('Self');
            const [db, setDb] = useState(null);
            const [language, setLanguage] = useState('English');
            
            const appId = 'medimind-universal-app';

            useEffect(() => {
                const initFirebase = async () => {
                    while (!window.firebaseModules) {
                        await new Promise(r => setTimeout(r, 50));
                    }
                    const { initializeApp, getAuth, onAuthStateChanged, getFirestore, doc, getDoc } = window.firebaseModules;
                    
                    try {
                        let firebaseConfig = CUSTOM_FIREBASE_CONFIG;
                        if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                            console.log("No Firebase Config detected. Running in Local Demo Mode.");
                            setAuthLoading(false);
                            return;
                        }

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const database = getFirestore(app);
                        setDb(database);
                        setAuthInstance(auth);
                        
                        onAuthStateChanged(auth, async (u) => {
                            if (u) {
                                const mockEmail = sessionStorage.getItem('mockEmail');
                                const enhancedUser = { uid: u.uid, email: u.email || mockEmail };
                                setUser(enhancedUser);
                                
                                try {
                                    const profileRef = doc(database, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
                                    const snap = await getDoc(profileRef);
                                    if (snap.exists()) {
                                        setUserProfile(snap.data());
                                    } else {
                                        setUserProfile(null);
                                    }
                                } catch (e) {
                                    console.warn("Error fetching profile", e);
                                    setUserProfile(null);
                                }
                            } else {
                                setUser(null);
                            }
                            setAuthLoading(false);
                        });
                    } catch (err) {
                        console.warn("Firebase init gracefully failed. Switching to Local Demo Mode.", err);
                        setAuthLoading(false);
                    }
                };
                initFirebase();
            }, []);

            if (authLoading) return <div className="h-[100dvh] flex items-center justify-center text-primary font-bold">Loading MediMind AI...</div>;
            
            if (!user) return <LoginScreen auth={authInstance} setUser={setUser} setUserProfile={setUserProfile} />;
            
            const isAdmin = user.email === 'admin@medimind.com';
            if (isAdmin) return <AdminApp user={user} auth={authInstance} />;

            if (user && !userProfile) return <OnboardingScreen db={db} user={user} appId={appId} onComplete={setUserProfile} />;

            const tabs = [
                { id: 'dashboard', label: translations[language].dashboard, icon: <Icons.Home /> },
                { id: 'memory', label: translations[language].memory, icon: <Icons.FileText /> },
                { id: 'analyzer', label: translations[language].analyzer, icon: <Icons.Search /> },
                { id: 'prescription', label: translations[language].prescription, icon: <Icons.Prescription /> },
                { id: 'pillScan', label: translations[language].pillScan, icon: <Icons.Pill /> },
                { id: 'hospitals', label: translations[language].hospitals, icon: <Icons.Hospital /> },
                { id: 'chat', label: translations[language].chat, icon: <Icons.Message /> },
                { id: 'medicines', label: translations[language].meds, icon: <Icons.Pill /> },
                { id: 'prep', label: translations[language].prep, icon: <Icons.Clipboard /> },
                { id: 'record', label: translations[language].record, icon: <Icons.Mic /> },
                { id: 'appointments', label: translations[language].appts, icon: <Icons.Calendar /> },
                { id: 'family', label: translations[language].family, icon: <Icons.Users /> },
                { id: 'wellness', label: translations[language].wellness, icon: <Icons.Chart /> },
                { id: 'settings', label: translations[language].settings, icon: <Icons.Settings /> }
            ];
            // ... rest of your application views
        };
    </script>
</body>
</html>
