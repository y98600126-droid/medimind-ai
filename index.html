        const callGemini = async (prompt, systemInstruction = "You are a helpful medical assistant.") => {
            const apiKey = GEMINI_API_KEY || (typeof __gemini_api_key !== 'undefined' ? __gemini_api_key : '');
            if (!apiKey) return "<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>⚠️ System Notice: Gemini API Key is not configured. Please add your key to the deployment configuration block to enable AI features.</div>";
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
            };
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process that.";
            } catch (e) {
                console.error("AI Text Error:", e.message || e);
                return "<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>Error connecting to AI Server. Please check your network or API Key.</div>";
            }
        };

        const GlobalMedicineReminder = ({ db, user, appId }) => {
            const remindedMedsRef = useRef(new Set());
            const [meds, setMeds] = useState([]);

            useEffect(() => {
                if ('Notification' in window && Notification.permission === 'default') {
                    try { Notification.requestPermission(); } catch (e) { console.warn(e); }
                }

                if (!db || !user || !appId) return;
                try {
                    const { collection, onSnapshot } = window.firebaseModules;
                    const medsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'medicines');
                    const unsubscribe = onSnapshot(medsRef, (snapshot) => {
                        const loadedMeds = [];
                        snapshot.forEach(doc => loadedMeds.push({ id: doc.id, ...doc.data() }));
                        setMeds(loadedMeds);
                    }, err => console.warn("Background Snapshot warn:", err));
                    return () => unsubscribe();
                } catch (e) {
                    console.warn("Global Reminder Init fallback", e);
                }
            }, [db, user, appId]);

            useEffect(() => {
                if (meds.length === 0) return;
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                    
                    meds.forEach(med => {
                        if (med.time === timeStr && med.status === 'pending') {
                            const remindKey = med.id + '-' + timeStr + '-' + now.toDateString();
                            if (!remindedMedsRef.current.has(remindKey)) {
                                remindedMedsRef.current.add(remindKey);
                                
                                if ('Notification' in window && Notification.permission === 'granted') {
                                    try {
                                        new Notification("MediMind Alert", {
                                            body: `It is time to take your medicine: ${med.name}`,
                                            icon: "https://cdn-icons-png.flaticon.com/512/2966/2966327.png"
                                        });
                                    } catch (e) { console.error("Notification error:", e); }
                                }

                                if ('speechSynthesis' in window) {
                                    try {
                                        const msg = new SpeechSynthesisUtterance(`Reminder: It is time to take your medicine, ${med.name}.`);
                                        window.speechSynthesis.speak(msg);
                                    } catch (e) {
                                        console.warn("Speech Synthesis blocked. Requires user interaction first.", e);
                                    }
                                }
                            }
                        }
                    });
                }, 10000); 
                return () => clearInterval(timer);
            }, [meds]);

            return null;

                    const { initializeApp, getAuth, onAuthStateChanged, getFirestore, doc, getDoc } = window.firebaseModules;

                        if (!firebaseConfig) {

                            if (envConfigStr) {
                                try { firebaseConfig = JSON.parse(envConfigStr); } catch (e) { console.warn("Env Config Parse Warn", e); }
                            }
                        }
                        
                        if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                            console.log("No Firebase Config detected. Running in Local Demo Mode.");
                            setAuthLoading(false);
                            return;

            const fileInputRef = useRef(null);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setImageMime(file.type);
                    setPreviewUrl(URL.createObjectURL(file));
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result.replace(/^data:.+;base64,/, '');

                let prompt = `Analyze this medical lab report or document. The user's preferred language is ${language}. Reply in ${language}.

                    return;

                const { collection, onSnapshot } = window.firebaseModules;
                const apptRef = collection(db, 'artifacts', appId, 'users', user.uid, 'appointments');
                
                const unsubscribe = onSnapshot(apptRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));

                    setAppointments(loaded);
                    setLoading(false);

                    return;

                try {
                    const { collection, addDoc } = window.firebaseModules;
                    const apptRef = collection(db, 'artifacts', appId, 'users', user.uid, 'appointments');
                    await addDoc(apptRef, newAppt);
                    setDocName(''); setSpecialty(''); setApptDate(''); setApptTime('');

                    console.error("Error adding appointment:", err);
                    setErrorMsg("Failed to save appointment.");

            const deleteAppointment = async (id) => {

                    setAppointments(appointments.filter(a => a.id !== id));
                    return;
                }
                try {
                    const { doc, deleteDoc } = window.firebaseModules;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'appointments', id));

            const getMonthDay = (dateString) => {

                    month: d.toLocaleString('default', { month: 'short' }).toUpperCase(),
                    day: d.getDate()

                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-slate-300"></div>
                                            <span className="text-sm font-medium text-slate-600">Windows PC</span>
                                        </div>
                                        <span className="text-xs text-slate-500">Oct 5</span>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-3 pt-4 border-t border-slate-100">
                                <button className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition shadow-sm">
                                    Export My Health Data
                                </button>
                                <button className="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl transition shadow-sm">
                                    Delete Account
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
            );
        };

        const AdminApp = ({ user, auth }) => {
            const [currentTab, setCurrentTab] = useState('overview');
            
            const handleSignOut = async () => {
                try {
                    if(window.firebaseModules?.signOut) {
                        await window.firebaseModules.signOut(auth);
                    }
                } catch(e) { console.warn(e); }
                window.location.reload();
            };

            const tabs = [
                { id: 'overview', label: 'System Overview', icon: <Icons.Chart /> },
                { id: 'patients', label: 'Patient Directory', icon: <Icons.Users /> },
                { id: 'alerts', label: 'System Alerts', icon: <Icons.Activity /> },
            ];

            return (
                <div className="flex flex-col md:flex-row h-[100dvh] overflow-hidden bg-slate-900 text-slate-200">
                    {/* Admin Mobile Header & Desktop Sidebar */}
                    <aside className="w-full md:w-64 bg-slate-950 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col shrink-0">
                        <div className="p-4 md:p-6 flex items-center justify-between md:justify-start gap-3">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-red-500 text-white rounded-xl flex items-center justify-center font-bold">A</div>
                                <h2 className="font-bold text-lg md:text-xl text-white">MediMind Admin</h2>
                            </div>
                            <button onClick={handleSignOut} className="md:hidden text-red-400 font-bold text-sm bg-slate-900 px-4 py-2 rounded-lg">Exit</button>
                        </div>
                        <nav className="flex md:flex-col overflow-x-auto md:overflow-x-hidden md:flex-1 px-4 py-2 md:py-4 space-x-2 md:space-x-0 md:space-y-2 hide-scroll">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setCurrentTab(tab.id)} className={`whitespace-nowrap flex-1 md:w-full flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium ${currentTab === tab.id ? 'bg-red-500 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {tab.icon} {tab.label}
                                </button>
                            ))}
                        </nav>
                        <div className="hidden md:block p-4 border-t border-slate-800">
                            <button onClick={handleSignOut} className="w-full text-left px-4 py-2 text-red-400 hover:text-red-300 font-bold text-sm">Sign Out Admin</button>
                        </div>
                    </aside>
                    
                    {/* Admin Main View */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto custom-scrollbar pb-20 md:pb-8">
                        <header className="mb-8 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                            <div>
                                <h1 className="text-2xl md:text-3xl font-bold text-white">Admin Control Panel</h1>
                                <p className="text-slate-400 text-sm md:text-base">Manage MediMind AI platform and users.</p>
                            </div>
                            <div className="bg-slate-800 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 border border-slate-700 self-start md:self-auto">
                                <span className="w-2 h-2 rounded-full bg-green-500"></span> System Online
                            </div>
                        </header>
                        
                        {currentTab === 'overview' && (
                            <div className="space-y-6 fade-in">
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                                    <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                                        <div className="text-slate-400 text-xs md:text-sm font-bold uppercase tracking-wider mb-2">Total Patients</div>
                                        <div className="text-3xl md:text-4xl font-black text-white">1,482</div>
                                        <div className="text-green-400 text-sm mt-2">↑ 12% this month</div>
                                    </div>
                                    <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                                        <div className="text-slate-400 text-xs md:text-sm font-bold uppercase tracking-wider mb-2">AI Queries Processed</div>
                                        <div className="text-3xl md:text-4xl font-black text-white">24,930</div>
                                        <div className="text-green-400 text-sm mt-2">↑ 5% today</div>
                                    </div>
                                    <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 sm:col-span-2 md:col-span-1">
                                        <div className="text-slate-400 text-xs md:text-sm font-bold uppercase tracking-wider mb-2">System Load</div>
                                        <div className="text-3xl md:text-4xl font-black text-white">24%</div>
                                        <div className="text-slate-400 text-sm mt-2">Normal operating bounds</div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {currentTab === 'patients' && (
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 p-4 md:p-6 fade-in">
                                <h3 className="font-bold text-lg md:text-xl text-white mb-4">Recent Registrations</h3>
                                <div className="space-y-4">
                                    {[1,2,3,4].map(i => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-slate-900 rounded-xl border border-slate-700">
                                            <div className="flex items-center gap-3 md:gap-4">
                                                <div className="w-10 h-10 bg-slate-700 text-slate-400 rounded-full flex items-center justify-center shrink-0"><Icons.Users /></div>
                                                <div>
                                                    <div className="font-bold text-white text-sm md:text-base">Patient #{1000 + i}</div>
                                                    <div className="text-xs md:text-sm text-slate-400">Joined recently</div>
                                                </div>
                                            </div>
                                            <button className="text-red-400 text-xs md:text-sm font-bold bg-slate-800 px-3 py-1.5 rounded-lg hover:bg-slate-700 transition">Profile</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {currentTab === 'alerts' && (
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 p-6 fade-in">
                                <div className="text-slate-400 py-10 md:py-20 text-center flex flex-col items-center gap-4">
                                    <Icons.Activity />
                                    No active system alerts. All services operating normally.
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
