        const buildProfileContext = (profile) => {

            return `\n\nCRITICAL PATIENT CONTEXT: Name: ${profile.name}, Age: ${profile.age}, Gender: ${profile.gender}, Height: ${profile.height}cm, Weight: ${profile.weight}kg, Allergies: ${profile.allergies || 'None'}, Past Operations: ${profile.operations || 'None'}, Blood Group: ${profile.bloodGroup || 'Unknown'}. Keep this specific patient's profile in mind for all your analysis and suggestions.`;

        // ---------------------------------------------------------------------------
        // AI calls go through the server route /api/gemini (the API key stays on the server).

        const AI_ERROR_HTML = "<div class='bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold'>Error connecting to AI Server. Please try again in a moment.</div>";

        const callBackend = async (body) => {
            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                if (!response.ok) {
                    console.error("AI Error:", data.error);
                    return AI_ERROR_HTML;
                }
                return data.text || "Sorry, I couldn't process that.";
            } catch (e) {
                console.error("AI Error:", e.message || e);
                return AI_ERROR_HTML;
            }
        };

        const callGemini = (prompt, systemInstruction = "You are a helpful medical assistant.") =>
            callBackend({ type: 'text', prompt, systemInstruction });

        const callGeminiImage = (prompt, base64Image, mimeType, systemInstruction = "You are a helpful medical assistant.") =>

        const GlobalMedicineReminder = ({ db, user, appId }) => {
            const remindedMedsRef = useRef(new Set());
            const [meds, setMeds] = useState([]);

            useEffect(() => {
                if ('Notification' in window && Notification.permission === 'default') {
                    try { Notification.requestPermission(); } catch (e) { console.warn(e); }
                }

                if (!db || !user || !appId) return;
                try {
                    const { collection, onSnapshot } = window.firebaseModules;
                    const medsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'medicines');
                    const unsubscribe = onSnapshot(medsRef, (snapshot) => {
                        const loadedMeds = [];
                        snapshot.forEach(doc => loadedMeds.push({ id: doc.id, ...doc.data() }));
                        setMeds(loadedMeds);
                    }, err => console.warn("Background Snapshot warn:", err));
                    return () => unsubscribe();
                } catch (e) {
                    console.warn("Global Reminder Init fallback", e);
                }
            }, [db, user, appId]);

            useEffect(() => {
                if (meds.length === 0) return;
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                    meds.forEach(med => {
                        if (med.time === timeStr && med.status === 'pending') {
                            const remindKey = med.id + '-' + timeStr + '-' + now.toDateString();
                            if (!remindedMedsRef.current.has(remindKey)) {
                                remindedMedsRef.current.add(remindKey);

                                if ('Notification' in window && Notification.permission === 'granted') {
                                    try {
                                        new Notification("MediMind Alert", {
                                            body: `It is time to take your medicine: ${med.name}`,
                                            icon: "https://cdn-icons-png.flaticon.com/512/2966/2966327.png"
                                        });
                                    } catch (e) { console.error("Notification error:", e); }
                                }

                                if ('speechSynthesis' in window) {
                                    try {
                                        const msg = new SpeechSynthesisUtterance(`Reminder: It is time to take your medicine, ${med.name}.`);
                                        window.speechSynthesis.speak(msg);
                                    } catch (e) {
                                        console.warn("Speech Synthesis blocked. Requires user interaction first.", e);
                                    }
                                }
                            }
                        }
                    });
                }, 10000);
                return () => clearInterval(timer);
            }, [meds]);

            return null;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [authInstance, setAuthInstance] = useState(null);
            const [currentTab, setCurrentTab] = useState(() => {
                try {
                    const code = new URLSearchParams(window.location.search).get('family');
                    if (code) {
                        sessionStorage.setItem('pendingFamilyCode', code);
                        window.history.replaceState({}, '', window.location.pathname);
                        return 'family';
                    }
                } catch (e) { /* ignore */ }
                return 'dashboard';
            });
            const [configError, setConfigError] = useState(false);
            const [profileError, setProfileError] = useState(false);
            const [db, setDb] = useState(null);
            const [language, setLanguage] = useState('English');

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'medimind-universal-app';

            useEffect(() => {
                const initFirebase = async () => {
                    while (!window.firebaseModules) {
                        await new Promise(r => setTimeout(r, 50));
                    }
                    const { initializeApp, getAuth, onAuthStateChanged, getFirestore, doc, getDoc } = window.firebaseModules;

                    try {
                        let firebaseConfig = CUSTOM_FIREBASE_CONFIG;
                        if (!firebaseConfig || !firebaseConfig.apiKey) {
                            const envConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                            if (envConfigStr) {
                                try { firebaseConfig = JSON.parse(envConfigStr); } catch (e) { console.warn("Env Config Parse Warn", e); }
                            }
                        }

                        if (!firebaseConfig || !firebaseConfig.apiKey) {
                            setConfigError(true);
                            setAuthLoading(false);
                            return;
                        }

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const database = getFirestore(app);
                        setDb(database);
                        setAuthInstance(auth);

                        onAuthStateChanged(auth, async (u) => {
                            if (u) {
                                setAuthLoading(true);
                                let profile = null;
                                let failed = false;
                                try {
                                    const profileRef = doc(database, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
                                    const snap = await getDoc(profileRef);
                                    profile = snap.exists() ? snap.data() : null;
                                } catch (e) {
                                    console.warn("Error fetching profile", e);
                                    failed = true;
                                }
                                setProfileError(failed);
                                setUserProfile(profile);
                                setUser({ uid: u.uid, email: u.email });
                            } else {
                                setUser(null);
                                setUserProfile(null);
                                setProfileError(false);
                            }
                            setAuthLoading(false);
                        });
                    } catch (err) {
                        console.warn("Firebase init failed.", err);
                        setConfigError(true);
                        setAuthLoading(false);
                    }
                };
                initFirebase();
            }, []);

            const handleSignOut = async () => {
                try {
                    if (authInstance && window.firebaseModules?.signOut) {
                        await window.firebaseModules.signOut(authInstance);

                } catch (e) { console.warn(e); }

                setUserProfile(null);
                setCurrentTab('dashboard');

            if (authLoading) return <div className="h-[100dvh] flex items-center justify-center text-primary font-bold">Loading MediMind AI...</div>;

            if (configError) return (

            if (profileError) return (
                <div className="min-h-[100dvh] flex items-center justify-center p-6 bg-background">
                    <div className="bg-surface p-8 rounded-3xl shadow-xl max-w-md text-center border border-slate-100 space-y-4">
                        <h2 className="text-xl font-bold text-slate-800">Couldn't load your profile</h2>
                        <p className="text-slate-500 text-sm">Please check your internet connection and try again. If this keeps happening, the database permissions (Firestore rules) may not be set up correctly.</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={() => window.location.reload()} className="bg-primary text-white font-bold px-5 py-2.5 rounded-xl">Try again</button>
                            <button onClick={handleSignOut} className="bg-slate-100 text-slate-700 font-bold px-5 py-2.5 rounded-xl">Sign out</button>
                        </div>
                    </div>
                </div>
            );

            if (!userProfile) return <OnboardingScreen db={db} user={user} appId={appId} onComplete={setUserProfile} />;

            const tabs = [
                { id: 'dashboard', label: translations[language].dashboard, icon: <Icons.Home /> },
                { id: 'memory', label: translations[language].memory, icon: <Icons.FileText /> },
                { id: 'analyzer', label: translations[language].analyzer, icon: <Icons.Search /> },
                { id: 'prescription', label: translations[language].prescription, icon: <Icons.Prescription /> },
                { id: 'pillScan', label: translations[language].pillScan, icon: <Icons.Pill /> },
                { id: 'hospitals', label: translations[language].hospitals, icon: <Icons.Hospital /> },
                { id: 'chat', label: translations[language].chat, icon: <Icons.Message /> },
                { id: 'medicines', label: translations[language].meds, icon: <Icons.Pill /> },
                { id: 'prep', label: translations[language].prep, icon: <Icons.Clipboard /> },
                { id: 'record', label: translations[language].record, icon: <Icons.Mic /> },
                { id: 'appointments', label: translations[language].appts, icon: <Icons.Calendar /> },
                { id: 'family', label: translations[language].family, icon: <Icons.Users /> },
                { id: 'wellness', label: translations[language].wellness, icon: <Icons.Chart /> },
                { id: 'settings', label: translations[language].settings, icon: <Icons.Settings /> },
            ];

            return (
                <LanguageContext.Provider value={{ language, setLanguage, t: translations[language] }}>
                <div className="flex h-[100dvh] overflow-hidden bg-background">

                    {/* Desktop Sidebar */}
                    <aside className="hidden md:flex flex-col w-64 bg-surface border-r border-slate-200 shadow-sm z-10 overflow-y-auto custom-scrollbar">
                        <div className="p-6 flex items-center gap-3 sticky top-0 bg-surface border-b border-slate-100 z-10">
                            <div className="w-10 h-10 bg-primary text-white rounded-xl flex items-center justify-center shadow-md">
                                <Icons.Activity />
                            </div>
                            <h2 className="font-bold text-xl text-slate-800 tracking-tight">MediMind AI</h2>
                        </div>
                        <nav className="flex-1 px-4 py-4 space-y-1">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setCurrentTab(tab.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm ${
                                        currentTab === tab.id
                                        ? 'bg-primary text-white shadow-md shadow-teal-100 font-semibold'
                                        : 'text-slate-600 hover:bg-teal-50 hover:text-primary font-medium'
                                    }`}
                                >
                                    {tab.icon} {tab.label}

                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-full relative">
                        {/* Mobile Header */}
                        <header className="md:hidden bg-surface border-b border-slate-200 p-4 flex items-center justify-between z-10 sticky top-0 shadow-sm">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-primary text-white rounded-lg flex items-center justify-center"><Icons.Activity /></div>
                                <h2 className="font-bold text-lg text-slate-800">MediMind AI</h2>
                            </div>
                            <button onClick={() => setCurrentTab('settings')} className="text-slate-500 hover:text-primary transition-colors"><Icons.Settings /></button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-28 md:pb-8 custom-scrollbar">
                            <div className="max-w-4xl mx-auto">

                                {currentTab === 'dashboard' && <Dashboard navigate={setCurrentTab} userProfile={userProfile} db={db} user={user} appId={appId} />}
                                {currentTab === 'memory' && <HealthMemory db={db} user={user} appId={appId} />}
                                {currentTab === 'analyzer' && <ReportAnalyzer userProfile={userProfile} />}
                                {currentTab === 'prescription' && <PrescriptionAnalyzer userProfile={userProfile} />}
                                {currentTab === 'pillScan' && <PillScanner userProfile={userProfile} />}
                                {currentTab === 'hospitals' && <NearbyHospitals />}
                                {currentTab === 'chat' && <AIBuddy userProfile={userProfile} />}
                                {currentTab === 'medicines' && <Medicines db={db} user={user} appId={appId} />}
                                {currentTab === 'prep' && <DoctorPrep userProfile={userProfile} />}
                                {currentTab === 'record' && <VisitRecording />}

                                <button

        };

        const LoginScreen = ({ auth }) => {
            const [isSignUp, setIsSignUp] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [loading, setLoading] = useState(false);

            const friendlyError = (err) => {
                switch (err && err.code) {
                    case 'auth/invalid-credential':
                    case 'auth/wrong-password':
                    case 'auth/user-not-found':
                        return 'Incorrect email or password.';
                    case 'auth/email-already-in-use':
                        return 'An account with this email already exists. Please sign in instead.';
                    case 'auth/weak-password':
                        return 'Password must be at least 6 characters.';
                    case 'auth/invalid-email':
                        return 'Please enter a valid email address.';
                    case 'auth/too-many-requests':
                        return 'Too many attempts. Please wait a moment and try again.';
                    case 'auth/operation-not-allowed':
                        return 'Email/password sign-in is not enabled for this app yet.';
                    case 'auth/network-request-failed':
                        return 'Network error. Please check your connection.';
                    default:
                        return (err && err.message) || 'Authentication failed. Please try again.';
                }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setErrorMsg('');
                if (!email || !password) {
                    setErrorMsg("Please enter both email and password.");
                    return;
                }
                if (!auth) {
                    setErrorMsg("The app is still starting up. Please try again in a moment.");
                    return;
                }

                setLoading(true);
                const { createUserWithEmailAndPassword, signInWithEmailAndPassword } = window.firebaseModules;
                try {
                    if (isSignUp) {
                        await createUserWithEmailAndPassword(auth, email.trim(), password);
                    } else {
                        await signInWithEmailAndPassword(auth, email.trim(), password);
                    }
                } catch (err) {
                    setErrorMsg(friendlyError(err));
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-[100dvh] flex items-center justify-center p-4 bg-background">
                    <div className="bg-surface p-8 rounded-3xl shadow-xl w-full max-w-md fade-in text-center border border-slate-100">
                        <div className="w-20 h-20 bg-primary text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-teal-200">
                            <Icons.Activity />
                        </div>
                        <h1 className="text-3xl font-bold text-slate-800 mb-2">MediMind AI</h1>
                        <p className="text-slate-500 mb-8">{isSignUp ? 'Create your secure health account.' : 'Your Health, Organized.'}</p>

                        <form onSubmit={handleAuth} className="space-y-4 text-left">
                            <input
                                type="email"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder="Email Address"
                                required
                                className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                            />
                            <input
                                id="pwdInput"
                                type="password"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                placeholder="Password"
                                required
                                className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                            />

                            {errorMsg && <p className="text-red-500 text-sm font-medium">{errorMsg}</p>}

                            <button type="submit" disabled={loading} className="w-full bg-primary hover:bg-primaryHover disabled:opacity-50 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                                {loading ? 'Processing...' : (isSignUp ? 'Create Account' : 'Sign In')}
                            </button>
                        </form>

                        <div className="mt-6">
                            <button onClick={() => { setIsSignUp(!isSignUp); setErrorMsg(''); }} className="text-primary font-bold text-sm hover:underline">
                                {isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const OnboardingScreen = ({ db, user, appId, onComplete }) => {
            const [formData, setFormData] = useState({
                name: '', age: '', gender: '', height: '', weight: '',
                phone: '', operations: '', allergies: '', bloodGroup: ''
            });
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');
                if (!db) {
                    setErrorMsg('Could not connect to the database. Please try again.');
                    return;
                }
                setLoading(true);
                try {
                    const { doc, setDoc } = window.firebaseModules;
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                    const profileData = { ...formData, createdAt: Date.now() };
                    await setDoc(profileRef, profileData);
                    onComplete(profileData);
                } catch (err) {
                    console.error("Error saving profile:", err);
                    setErrorMsg('Could not save your profile. Please check your connection and try again.');
                    setLoading(false);
                }
            };

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            return (
                <div className="min-h-[100dvh] flex items-center justify-center p-4 bg-background py-10">
                    <div className="bg-surface p-8 rounded-3xl shadow-xl w-full max-w-2xl fade-in border border-slate-100 relative overflow-hidden">
                        <h2 className="text-3xl font-bold text-slate-800 mb-2 mt-6">Welcome to MediMind AI!</h2>
                        <p className="text-slate-500 mb-8">Before we start, let's set up your health profile so our AI can give you personalized and safe suggestions.</p>

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Full Name *</label><input required name="name" value={formData.name} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" /></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Age *</label><input required type="number" name="age" value={formData.age} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" /></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Gender</label><select required name="gender" value={formData.gender} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Phone Number *</label><input required type="tel" name="phone" value={formData.phone} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" /></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Height (cm)</label><input type="number" name="height" value={formData.height} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" /></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Weight (kg)</label><input type="number" name="weight" value={formData.weight} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" /></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">Blood Group (Optional)</label><input name="bloodGroup" placeholder="Blood group" value={formData.bloodGroup} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" /></div>
                            </div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-1">Recent or Past Operations</label><textarea name="operations" placeholder="Include any surgeries you've had..." value={formData.operations} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary resize-none h-20" /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-1">Allergies</label><textarea name="allergies" placeholder="Any food or medicine allergies?" value={formData.allergies} onChange={handleChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary resize-none h-20" /></div>

                            {errorMsg && <p className="text-red-500 text-sm font-medium">{errorMsg}</p>}
                            <button type="submit" disabled={loading} className="w-full bg-primary hover:bg-primaryHover disabled:opacity-50 text-white font-bold py-4 rounded-xl transition-all shadow-md">
                                {loading ? 'Saving Profile...' : 'Save & Continue'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ navigate, userProfile, db, user, appId }) => {
            const [meds, setMeds] = useState([]);
            const [appts, setAppts] = useState([]);

            useEffect(() => {
                if (!db || !user || !appId) return;
                const { collection, onSnapshot } = window.firebaseModules;
                const base = ['artifacts', appId, 'users', user.uid];
                const u1 = onSnapshot(collection(db, ...base, 'medicines'), (snap) => {
                    const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setMeds(l);
                }, (e) => console.warn(e));
                const u2 = onSnapshot(collection(db, ...base, 'appointments'), (snap) => {
                    const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setAppts(l);
                }, (e) => console.warn(e));
                return () => { u1(); u2(); };
            }, [db, user, appId]);

            const now = new Date();
            const hour = now.getHours();
            const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
            const nowStr = String(hour).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            const to12h = (hhmm) => {
                if (!hhmm) return '';
                const [h, m] = hhmm.split(':').map(Number);
                return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
            };

            const pending = meds.filter(m => m.status === 'pending').sort((a, b) => a.time.localeCompare(b.time));
            const nextMed = pending.find(m => m.time >= nowStr) || pending[0] || null;

            const nextAppt = appts
                .filter(a => a.date && new Date(`${a.date}T${a.time || '00:00'}`) >= now)
                .sort((a, b) => new Date(`${a.date}T${a.time || '00:00'}`) - new Date(`${b.date}T${b.time || '00:00'}`))[0] || null;

            return (
                <div className="space-y-6 fade-in">
                    <div>
                        <h1 className="text-3xl font-bold text-slate-800">{greeting}{userProfile?.name ? `, ${userProfile.name}` : ''}!</h1>
                        <p className="text-slate-500">Here is your health overview for today.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div onClick={() => navigate('analyzer')} className="bg-gradient-to-br from-primary to-secondary p-6 rounded-3xl shadow-md text-white cursor-pointer hover:shadow-lg transition transform hover:-translate-y-1">
                            <Icons.Search />
                            <h2 className="text-xl font-bold mt-4 mb-1">Analyze a Report</h2>
                            <p className="text-teal-50 text-sm">Upload labs or prescriptions for simple explanations.</p>
                        </div>

                        <div className="space-y-4">
                            <div className="bg-surface p-5 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="bg-blue-50 text-secondary p-3 rounded-full"><Icons.Pill /></div>
                                <div className="flex-1">
                                    <p className="text-xs font-bold text-secondary uppercase tracking-wider">Next Medicine</p>
                                    <h3 className="font-bold text-slate-800">
                                        {nextMed ? `${nextMed.name} • ${to12h(nextMed.time)}` : (meds.length === 0 ? 'No medicines added yet' : 'All medicines taken')}
                                    </h3>
                                </div>
                                <button onClick={() => navigate('medicines')} className="text-primary bg-teal-50 px-4 py-2 rounded-xl text-sm font-bold">{meds.length === 0 ? 'Add' : 'View'}</button>
                            </div>
                            <div className="bg-surface p-5 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                                <div className="bg-orange-50 text-orange-500 p-3 rounded-full"><Icons.Calendar /></div>
                                <div className="flex-1">
                                    <p className="text-xs font-bold text-orange-500 uppercase tracking-wider">Upcoming Visit</p>
                                    <h3 className="font-bold text-slate-800">
                                        {nextAppt
                                            ? `${nextAppt.doctor} • ${new Date(`${nextAppt.date}T00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}${nextAppt.time ? ' ' + to12h(nextAppt.time) : ''}`
                                            : 'No upcoming appointments'}
                                    </h3>
                                </div>
                                <button onClick={() => navigate('appointments')} className="text-orange-600 bg-orange-50 px-4 py-2 rounded-xl text-sm font-bold">{nextAppt ? 'View' : 'Add'}</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HealthMemory = ({ db, user, appId }) => {
            const { t } = useContext(LanguageContext);
            const [records, setRecords] = useState([]);
            const [loading, setLoading] = useState(true);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (!db || !user || !appId) {
                    setRecords([]);
                    setLoading(false);
                    return;
                }
                const { collection, onSnapshot } = window.firebaseModules;
                const recordsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'records');

                const unsubscribe = onSnapshot(recordsRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
                    loaded.sort((a, b) => b.createdAt - a.createdAt);

                    setRecords(loaded);
                    setLoading(false);
                }, (err) => {
                    console.warn("Firestore error in Health Memory fallback:", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [db, user, appId]);

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                let docType = "Document";
                if (file.type.startsWith('image/')) docType = "Imaging / Scan";
                else if (file.type === 'application/pdf') docType = "PDF Report";

                const newRec = {
                    title: file.name,
                    date: new Date().toLocaleDateString(),
                    type: docType,
                    createdAt: Date.now()
                };

                if (db && user && appId) {
                    try {
                        const { collection, addDoc } = window.firebaseModules;
                        const recordsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'records');
                        await addDoc(recordsRef, newRec);
                    } catch (e) { console.error(e); }
                } else {
                    setRecords(prev => [newRec, ...prev]);
                }
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800">{t.memory}</h2>
                        <input type="file" ref={fileInputRef} onChange={handleUpload} className="hidden" />
                        <button onClick={() => fileInputRef.current?.click()} className="bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-sm transition">
                            <Icons.Upload /> Upload
                        </button>
                    </div>
                    <div className="grid gap-4">
                        {loading && <p className="text-slate-500 text-sm">Loading records...</p>}
                        {!loading && records.length === 0 && <div className="text-center p-10 bg-white border border-slate-200 rounded-3xl text-slate-500 shadow-sm">No records uploaded yet.</div>}
                        {!loading && records.map((doc) => (
                            <div key={doc.id} className="bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between hover:border-primary transition cursor-pointer shadow-sm">
                                <div className="flex items-center gap-4">
                                    <div className="bg-slate-100 p-3 rounded-xl text-slate-500"><Icons.FileText /></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800">{doc.title}</h4>
                                        <p className="text-sm text-slate-500">{doc.date} • {doc.type}</p>
                                    </div>
                                </div>
                                <button className="text-primary text-sm font-bold hover:underline">View</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ReportAnalyzer = ({ userProfile }) => {
            const { language } = useContext(LanguageContext);
            const [text, setText] = useState('');

                const medsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'medicines');

                const unsubscribe = onSnapshot(medsRef, (snapshot) => {
                    const loadedMeds = [];
                    snapshot.forEach((doc) => {
                        loadedMeds.push({ id: doc.id, ...doc.data() });
                    });
                    loadedMeds.sort((a, b) => a.time.localeCompare(b.time));
                    setMeds(loadedMeds);
                    setLoading(false);

                    console.warn("Firestore fallback trigger", error);
                    setLoading(false);

                return () => unsubscribe();

                    return;

                    const { doc, updateDoc } = window.firebaseModules;
                    const medRef = doc(db, 'artifacts', appId, 'users', user.uid, 'medicines', id);

                };

                    setMeds(prev => [...prev, { id: Date.now().toString(), ...newEntry }].sort((a, b) => a.time.localeCompare(b.time)));
                    setNewMedName('');
                    setNewMedTime('');
                    return;
                }

                try {
                    const { collection, addDoc } = window.firebaseModules;
                    const medsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'medicines');
                    await addDoc(medsRef, newEntry);
                    setNewMedName('');
                    setNewMedTime('');
                } catch (err) {
                    console.error("Error saving medicine:", err);
                    setErrorMsg("Failed to add medicine.");
                }
            };

            const deleteMed = async (id) => {
                if (!db || !user || !appId) {
                    setMeds(meds.filter(m => m.id !== id));
                    return;
                }
                try {
                    const { doc, deleteDoc } = window.firebaseModules;
                    const medRef = doc(db, 'artifacts', appId, 'users', user.uid, 'medicines', id);

        const FamilyCare = ({ db, user, appId, userProfile }) => {
            const [invite, setInvite] = useState(null);
            const [caregivers, setCaregivers] = useState([]);
            const [members, setMembers] = useState([]);
            const [linkInput, setLinkInput] = useState(() => sessionStorage.getItem('pendingFamilyCode') || '');
            const [msg, setMsg] = useState({ type: '', text: '' });
            const [busy, setBusy] = useState(false);
            const [selected, setSelected] = useState(null);
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                const { collection, onSnapshot, doc } = window.firebaseModules;
                const base = ['artifacts', appId, 'users', user.uid];
                const onErr = (e) => console.warn('Family listener:', e);
                const toList = (snap) => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); return l; };
                const u1 = onSnapshot(doc(db, ...base, 'settings', 'familyInvite'), (snap) => setInvite(snap.exists() ? snap.data() : null), onErr);
                const u2 = onSnapshot(collection(db, ...base, 'caregivers'), (snap) => setCaregivers(toList(snap)), onErr);
                const u3 = onSnapshot(collection(db, ...base, 'family'), (snap) => setMembers(toList(snap)), onErr);
                return () => { u1(); u2(); u3(); };
            }, [db, user.uid, appId]);

            const activeInvite = invite && invite.code && invite.expiresAt > Date.now() ? invite : null;
            const inviteLink = activeInvite ? `${window.location.origin}/?family=${activeInvite.code}` : '';

            const generateCode = () => {
                const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                const bytes = new Uint8Array(10);
                crypto.getRandomValues(bytes);
                return Array.from(bytes).map(b => alphabet[b % alphabet.length]).join('');
            };

            const parseCode = (input) => {
                const raw = (input || '').trim();
                const m = raw.match(/[?&]family=([A-Za-z0-9]+)/);
                return (m ? m[1] : raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
            };

            const createInvite = async () => {
                setMsg({ type: '', text: '' });
                setBusy(true);
                try {
                    const { doc, setDoc, deleteDoc } = window.firebaseModules;
                    if (invite && invite.code) {
                        try { await deleteDoc(doc(db, 'artifacts', appId, 'invites', invite.code)); } catch (e) { /* old link already gone */ }
                    }
                    const code = generateCode();
                    const expiresAt = Date.now() + 7 * 24 * 60 * 60 * 1000;
                    await setDoc(doc(db, 'artifacts', appId, 'invites', code), {
                        ownerUid: user.uid, ownerName: userProfile?.name || '', createdAt: Date.now(), expiresAt
                    });
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'familyInvite'), { code, expiresAt });
                } catch (e) {
                    console.error(e);
                    setMsg({ type: 'error', text: 'Could not create the family link. Please try again.' });
                }
                setBusy(false);
            };

            const cancelInvite = async () => {
                setBusy(true);
                try {
                    const { doc, deleteDoc } = window.firebaseModules;
                    if (invite && invite.code) {
                        try { await deleteDoc(doc(db, 'artifacts', appId, 'invites', invite.code)); } catch (e) { /* ignore */ }
                    }
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'familyInvite'));
                } catch (e) { console.error(e); }
                setBusy(false);
            };

            const copyLink = async () => {
                try {
                    await navigator.clipboard.writeText(inviteLink);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) {
                    window.prompt('Copy this family link:', inviteLink);
                }
            };

            const addMember = async () => {
                setMsg({ type: '', text: '' });
                const code = parseCode(linkInput);
                if (!code) {
                    setMsg({ type: 'error', text: 'Please paste the family link or code.' });
                    return;
                }
                setBusy(true);
                try {
                    const { doc, getDoc, setDoc } = window.firebaseModules;
                    const inviteSnap = await getDoc(doc(db, 'artifacts', appId, 'invites', code));
                    if (!inviteSnap.exists()) {
                        setMsg({ type: 'error', text: 'This family link is invalid or has been cancelled.' });
                        setBusy(false);
                        return;
                    }
                    const inv = inviteSnap.data();
                    if (inv.expiresAt < Date.now()) {
                        setMsg({ type: 'error', text: 'This family link has expired. Ask them to create a new one.' });
                        setBusy(false);
                        return;
                    }
                    if (inv.ownerUid === user.uid) {
                        setMsg({ type: 'error', text: "That is your own link. Share it with a family member instead." });
                        setBusy(false);
                        return;
                    }
                    if (members.some(m => m.ownerUid === inv.ownerUid)) {
                        setMsg({ type: 'error', text: 'This family member is already added.' });
                        setBusy(false);
                        return;
                    }
                    await setDoc(doc(db, 'artifacts', appId, 'users', inv.ownerUid, 'caregivers', user.uid), {
                        code, name: userProfile?.name || '', createdAt: Date.now()
                    });
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'family', inv.ownerUid), {
                        ownerUid: inv.ownerUid, name: inv.ownerName || 'Family member', addedAt: Date.now()
                    });
                    sessionStorage.removeItem('pendingFamilyCode');
                    setLinkInput('');
                    setMsg({ type: 'success', text: `${inv.ownerName || 'Family member'} was added to your family.` });
                } catch (e) {
                    console.error(e);
                    setMsg({ type: 'error', text: 'Could not add this family member. Please try again.' });
                }
                setBusy(false);
            };

            const removeMember = async (m) => {
                try {
                    const { doc, deleteDoc } = window.firebaseModules;
                    try { await deleteDoc(doc(db, 'artifacts', appId, 'users', m.ownerUid, 'caregivers', user.uid)); } catch (e) { /* access may already be removed */ }
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'family', m.ownerUid));
                    if (selected && selected.ownerUid === m.ownerUid) setSelected(null);
                } catch (e) { console.error(e); }
            };

            const removeCaregiver = async (c) => {
                try {
                    const { doc, deleteDoc } = window.firebaseModules;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'caregivers', c.id));
                } catch (e) { console.error(e); }
            };

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="text-2xl font-bold text-slate-800">Family Care</h2>

                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="font-bold text-slate-700">Add a family member</h3>
                        <p className="text-sm text-slate-500">Ask your family member to open Family Care in their own MediMind account, create a family link, and send it to you. Paste it below.</p>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input value={linkInput} onChange={(e) => setLinkInput(e.target.value)} placeholder="Paste family link or code" className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" />
                            <button onClick={addMember} disabled={busy} className="bg-primary hover:bg-primaryHover disabled:opacity-50 text-white px-6 py-3 rounded-xl font-bold transition shadow-md whitespace-nowrap">Add</button>
                        </div>
                        {msg.text && <p className={`text-sm font-medium ${msg.type === 'error' ? 'text-red-500' : 'text-teal-600'}`}>{msg.text}</p>}
                    </div>

                    <div className="space-y-3">
                        <h3 className="font-bold text-slate-700">Family members you can view</h3>
                        {members.length === 0 && <div className="text-center p-8 bg-white border border-slate-200 rounded-3xl text-slate-500 shadow-sm">No family members added yet.</div>}
                        {members.map(m => (
                            <div key={m.id} className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                                <div className="flex items-center gap-3"><Icons.Users /><span className="font-bold text-slate-800">{m.name}</span></div>
                                <div className="flex gap-2">
                                    <button onClick={() => setSelected(m)} className="text-primary bg-teal-50 px-4 py-2 rounded-xl text-sm font-bold">View</button>
                                    <button onClick={() => removeMember(m)} className="text-red-500 bg-red-50 px-4 py-2 rounded-xl text-sm font-bold">Remove</button>
                                </div>
                            </div>
                        ))}
                        {selected && <FamilyMemberView db={db} appId={appId} member={selected} onClose={() => setSelected(null)} />}
                    </div>

                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="font-bold text-slate-700">Share my health info</h3>
                        <p className="text-sm text-slate-500">Create a family link and send it to someone you trust. Once they add it, they can view (not edit) your profile, medicines and appointments. The link works for 7 days.</p>
                        {!activeInvite ? (
                            <button onClick={createInvite} disabled={busy} className="bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white px-6 py-3 rounded-xl font-bold transition shadow-md">Create my family link</button>
                        ) : (
                            <div className="space-y-2">
                                <div className="flex flex-col sm:flex-row gap-2">
                                    <input readOnly value={inviteLink} onFocus={(e) => e.target.select()} className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                                    <button onClick={copyLink} className="bg-primary text-white px-6 py-3 rounded-xl font-bold shadow-md whitespace-nowrap">{copied ? 'Copied!' : 'Copy'}</button>
                                </div>
                                <p className="text-xs text-slate-500">Code: <b>{activeInvite.code}</b> • Expires {new Date(activeInvite.expiresAt).toLocaleDateString()}</p>
                                <button onClick={cancelInvite} disabled={busy} className="text-red-500 text-sm font-bold hover:underline">Cancel this link</button>
                            </div>
                        )}

                        {caregivers.length > 0 && (
                            <div className="pt-3 border-t border-slate-100 space-y-2">
                                <h4 className="font-bold text-slate-700 text-sm">People who can view my info</h4>
                                {caregivers.map(c => (
                                    <div key={c.id} className="flex items-center justify-between text-sm">
                                        <span className="text-slate-800 font-medium">{c.name || 'Family member'}</span>
                                        <button onClick={() => removeCaregiver(c)} className="text-red-500 font-bold hover:underline">Remove access</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const WellnessTracker = ({ db, user, appId, userProfile }) => {
            const [entries, setEntries] = useState({});
            const [sleep, setSleep] = useState('');
            const [steps, setSteps] = useState('');
            const [msg, setMsg] = useState('');
            const [saving, setSaving] = useState(false);

            const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const todayKey = keyOf(new Date());

            useEffect(() => {
                if (!db || !user || !appId) return;
                const { collection, onSnapshot } = window.firebaseModules;
                const unsub = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'wellness'), (snap) => {
                    const map = {};
                    snap.forEach(d => { map[d.id] = d.data(); });
                    setEntries(map);
                }, (e) => console.warn(e));
                return () => unsub();
            }, [db, user, appId]);

            useEffect(() => {
                const today = entries[todayKey];
                if (today) {
                    setSleep(today.sleep !== undefined && today.sleep !== null ? String(today.sleep) : '');
                    setSteps(today.steps !== undefined && today.steps !== null ? String(today.steps) : '');
                }
            }, [entries[todayKey] && entries[todayKey].updatedAt]);

            const save = async () => {
                setMsg('');
                if (sleep === '' && steps === '') {
                    setMsg('Enter your sleep hours or steps first.');
                    return;
                }
                setSaving(true);
                try {
                    const { doc, setDoc } = window.firebaseModules;
                    const data = { date: todayKey, updatedAt: Date.now() };
                    if (sleep !== '') data.sleep = Number(sleep);
                    if (steps !== '') data.steps = Number(steps);
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'wellness', todayKey), data, { merge: true });
                    setMsg('Saved.');
                } catch (e) {
                    console.error(e);
                    setMsg('Could not save. Please try again.');
                }
                setSaving(false);
            };

            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                days.push({ key: keyOf(d), label: d.toLocaleDateString(undefined, { weekday: 'short' }) });
            }

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="text-2xl font-bold text-slate-800">Wellness Tracker</h2>

                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h3 className="font-bold text-slate-700">Log today</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <input value={sleep} onChange={(e) => setSleep(e.target.value)} type="number" min="0" max="24" step="0.5" placeholder="Sleep (hours)" className="p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" />
                            <input value={steps} onChange={(e) => setSteps(e.target.value)} type="number" min="0" placeholder="Steps" className="p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary" />
                            <button onClick={save} disabled={saving} className="bg-primary hover:bg-primaryHover disabled:opacity-50 text-white px-6 py-3 rounded-xl font-bold transition shadow-md">Save</button>
                        </div>
                        {msg && <p className="text-sm font-medium text-slate-600">{msg}</p>}
                    </div>

                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <h3 className="font-bold text-slate-700 mb-4">Sleep (Last 7 Days)</h3>
                        <div className="flex items-end justify-between h-32 gap-2">
                            {days.map(day => {
                                const hrs = entries[day.key] && entries[day.key].sleep;
                                const has = hrs !== undefined && hrs !== null;
                                return (
                                    <div key={day.key} className="flex-1 flex flex-col items-center gap-2 group">
                                        <div className="w-full bg-slate-100 rounded-t-lg relative h-full flex items-end">
                                            <div className="w-full bg-secondary rounded-t-lg transition-all" style={{ height: has ? `${Math.min(100, (hrs / 12) * 100)}%` : '0%' }}></div>
                                        </div>
                                        <span className="text-xs text-slate-400">{has ? `${hrs}h` : '–'}</span>
                                        <span className="text-[10px] text-slate-400">{day.label}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white p-5 rounded-3xl border border-slate-200 text-center shadow-sm">
                            <div className="text-slate-400 mb-2">Weight</div>
                            <div className="text-2xl font-bold text-slate-800">{userProfile?.weight ? `${userProfile.weight} kg` : '–'}</div>
                        </div>
                        <div className="bg-white p-5 rounded-3xl border border-slate-200 text-center shadow-sm">
                            <div className="text-slate-400 mb-2">Steps today</div>
                            <div className="text-2xl font-bold text-slate-800">{entries[todayKey] && entries[todayKey].steps !== undefined ? Number(entries[todayKey].steps).toLocaleString() : '–'}</div>
                        </div>
                    </div>
                </div>
            );
        };

        const Settings = ({ user, userProfile, onSignOut }) => {
            const { language, setLanguage, t } = useContext(LanguageContext);
            const [showPrivacy, setShowPrivacy] = useState(false);

            const getDeviceName = () => {
                const ua = navigator.userAgent;
                if(ua.includes("Windows")) return "Windows PC";
                if(ua.includes("Mac")) return "MacBook / iMac";
                if(ua.includes("Linux")) return "Linux Device";
                if(ua.includes("Android")) return "Android Phone";
                if(ua.includes("iPhone") || ua.includes("iPad")) return "iOS Device";
                return "Unknown Device";
            };

            return (
            <div className="space-y-6 fade-in">
                <h2 className="text-2xl font-bold text-slate-800">{t.settings}</h2>

                <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden divide-y divide-slate-100 shadow-sm">
                    {userProfile && (
                        <div className="p-5 flex flex-col gap-1">
                            <span className="font-bold text-slate-800 text-lg">My Health Profile</span>
                            <div className="text-sm text-slate-500 grid grid-cols-2 gap-2 mt-2">
                                <div><span className="font-medium text-slate-700">Name:</span> {userProfile.name}</div>
                                <div><span className="font-medium text-slate-700">Age:</span> {userProfile.age}</div>
                                <div><span className="font-medium text-slate-700">Gender:</span> {userProfile.gender}</div>
                                <div><span className="font-medium text-slate-700">Blood Grp:</span> {userProfile.bloodGroup || 'N/A'}</div>
                            </div>
                        </div>
                    )}
                    <div className="p-5 flex justify-between items-center">
                        <span className="font-medium text-slate-700">Language</span>
                        <select value={language} onChange={(e) => setLanguage(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary">
                            <option value="English">English</option>
                            <option value="Telugu">Telugu</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Tamil">Tamil</option>
                        </select>
                    </div>
                    <div className="p-5 flex justify-between items-center">
                        <span className="font-medium text-slate-700">Notifications & Sounds</span>
                        <input type="checkbox" defaultChecked className="w-5 h-5 accent-primary" />
                    </div>
                    <div className="p-5 flex justify-between items-center">
                        <span className="font-medium text-slate-700">Privacy & Data</span>
                        <button onClick={() => setShowPrivacy(true)} className="text-primary text-sm font-bold hover:underline bg-teal-50 px-4 py-2 rounded-xl">Manage</button>
                    </div>
                </div>

                <button onClick={onSignOut} className="w-full bg-red-50 border border-red-100 text-red-500 font-bold py-4 rounded-3xl hover:bg-red-100 transition shadow-sm">Sign Out</button>

                {showPrivacy && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl max-w-md w-full max-h-[90dvh] overflow-y-auto p-6 shadow-2xl space-y-6 fade-in relative custom-scrollbar">
                            <button onClick={() => setShowPrivacy(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold p-2">✕</button>
                            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2 pr-8"><Icons.Settings /> Privacy & Security</h3>

                            <div>
                                <h4 className="font-bold text-slate-700 mb-2">Current Device</h4>
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-green-500"></div>
                                            <span className="text-sm font-bold text-slate-800">{getDeviceName()}</span>
                                        </div>
                                        <span className="text-[10px] md:text-xs font-bold text-primary bg-teal-50 px-2 py-1 rounded-md">Active Now</span>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-3 pt-4 border-t border-slate-100">
                                <button className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition shadow-sm">
                                    Export My Health Data
                                </button>
                                <button className="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl transition shadow-sm">
                                    Delete Account
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
